<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kurso — le cahier qui te fait réviser</title>
    <meta name="description" content="Tu écris tes cours au Pencil. Kurso date chaque page, la range dans la bonne matière, et la transforme en cartes de révision. Bêta à la rentrée, sur iPad et Mac." />
    <meta name="theme-color" content="#131A33" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:title" content="Kurso — le cahier qui te fait réviser" />
    <meta property="og:description" content="Tes cours au Pencil, rangés tout seuls, révisés au bon moment. Bêta à la rentrée." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://kurso.app/" />
    <meta property="og:image" content="https://kurso.app/img/film-poster.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Seules les deux polices du haut de page sont prechargees : le reste
         ne doit pas rentrer en concurrence avec le premier rendu. -->
    <link rel="preload" href="/fonts/baloo2-800.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/nunito-700.woff2" as="font" type="font/woff2" crossorigin />
    <!-- L'affiche de la boucle est le premier pixel peint du heros : elle
         part avant que le film ne commence a se telecharger. -->
    <link rel="preload" href="/img/boucle-poster.jpg" as="image" fetchpriority="high" />
    <!-- Pose la classe avant le premier rendu. Sans elle, la page s'affiche
         d'abord dans son etat SANS animation — scenes jouees jusqu'au bout —
         puis saute a leur debut quand React demarre. Et sans script du tout,
         c'est justement cet etat final qui reste, qui est le bon. -->
    <script>
      try {
        var r = document.documentElement
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          r.className += ' motion'
          if (matchMedia('(hover: hover) and (pointer: fine)').matches) r.className += ' fine'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
